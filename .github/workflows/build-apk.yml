name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Build bản Release (nếu chưa có keystore, hãy dùng assembleDebug để chạy thử trước)
    - name: Build with Gradle
      run: ./gradlew assembleRelease 

    # Đổi tên file APK sau khi build xong
    - name: Rename APK
      run: |
        mkdir -p build_output
        # Tìm file apk vừa build và copy đổi tên thành release-0.1.0.apk
        find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build_output/release-0.1.0.apk \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-0.1.0-apk
        path: build_output/release-0.1.0.apk
